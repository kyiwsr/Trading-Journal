services:
  - type: web
    name: trading-journal-api
    runtime: python
    plan: free
    # Keep this next to the Supabase project's region.
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # The free plan has no pre-deploy step, so migrations run at every start. They are a no-op when up to date.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      # Vercel rewrite plus Render's own proxy: two hops append to X-Forwarded-For.
      - key: TRUSTED_PROXY_HOPS
        value: "2"
      - key: SUPABASE_BUCKET
        value: screenshots
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
